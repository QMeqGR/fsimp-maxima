[package]
name = "fullsimp"
version = "0.0.4"
description = "Search Maxima's simplification routines for the simplest equivalent form of an expression"
license = "GPL-2.0-or-later"
entry = "fullsimp.mac"
repository = "https://github.com/QMeqGR/fsimp-maxima"
keywords = ["simplification", "trigonometry", "algebra"]
